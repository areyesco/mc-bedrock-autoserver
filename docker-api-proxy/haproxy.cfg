global
    log stdout format raw local0

# Make the private Unix socket usable by Lazytainer. It lives in a named Docker
# volume that is not mounted into the Bedrock container.
unix-bind mode 0666

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Java control plane. TCP is reachable only from the internal docker-api
# network. In addition to read/start/stop, it can create Docker exec sessions
# ONLY inside the existing minecraft-bedrock container. Those exec sessions are
# used for Bedrock's bundled send-command helper and fixed allowlist reads.
frontend docker_api_java
    bind *:2375

    acl read_method method GET HEAD
    acl write_method method POST

    acl read_path path_reg -i ^(/v[0-9.]+)?/(_ping|version|containers/json|containers/[A-Za-z0-9_.-]+/json)$
    acl exec_read_path path_reg -i ^(/v[0-9.]+)?/exec/[A-Fa-f0-9]+/json$

    acl bedrock_lifecycle_path path_reg -i ^(/v[0-9.]+)?/containers/minecraft-bedrock/(start|stop)$
    acl wake_restart_path path_reg -i ^(/v[0-9.]+)?/containers/minecraft-wake/restart$
    acl bedrock_exec_create path_reg -i ^(/v[0-9.]+)?/containers/minecraft-bedrock/exec$
    acl exec_start_path path_reg -i ^(/v[0-9.]+)?/exec/[A-Fa-f0-9]+/start$

    http-request allow if read_method read_path
    http-request allow if read_method exec_read_path
    http-request allow if write_method bedrock_lifecycle_path
    http-request allow if write_method wake_restart_path
    http-request allow if write_method bedrock_exec_create
    http-request allow if write_method exec_start_path
    http-request deny deny_status 403
    default_backend docker_socket

# Lazytainer's wake path is a separate Unix-socket frontend. It deliberately
# retains the old narrow capabilities and cannot use Docker exec.
frontend docker_api_wake
    bind /run/docker-api/docker.sock

    acl read_method method GET HEAD
    acl write_method method POST
    acl read_path path_reg -i ^(/v[0-9.]+)?/(_ping|version|containers/json|containers/[A-Za-z0-9_.-]+/json)$
    acl write_path path_reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/(start|stop)$

    http-request allow if read_method read_path
    http-request allow if write_method write_path
    http-request deny deny_status 403
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
